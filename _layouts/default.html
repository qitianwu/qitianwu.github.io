<!DOCTYPE html>
<html lang="en">
<head>

  <!-- Basic Page Needs
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
  <meta charset="utf-8">
  <title>{{ site.data.main_info.name }} | {{ page.title }}</title>
  <meta name="description" content="Qitian Wu — Research Scientist at Google Research working on LLM post-training and agents.">
  <meta name="author" content="Qitian Wu">
  <meta property="og:title" content="Qitian Wu" />
  <meta property="og:description" content="Research Scientist at Google Research working on LLM post-training and agents." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://qitianwu.github.io/" />
  <meta property="og:site_name" content="Qitian Wu" />
  <link rel="canonical" href="https://qitianwu.github.io/" />

  <!-- Mobile Specific Metas
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- FONT
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
  <link href='https://fonts.googleapis.com/css?family=Raleway:400,300,600' rel='stylesheet' type='text/css'>

  <!-- CSS
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
  <link rel="stylesheet" href={{ "/libs/external/skeleton/normalize.css" | prepend: site.baseurl }}>
  <link rel="stylesheet" href={{ "/libs/external/skeleton/skeleton.css" | prepend: site.baseurl }}>
  <link rel="stylesheet" href={{ "/libs/custom/my_css.css" | prepend: site.baseurl }}>

  <!-- Scripts
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
  <script src={{ "/libs/external/jquery-3.1.1.min.js" | prepend: site.baseurl }}></script>
  <script src={{ "/libs/custom/my_js.js" | prepend: site.baseurl }}></script>

  <!-- Favicon
  –––––––––––––––––––––––––––––––––––––––––––––––––– -->
  <link rel="icon" type="image/png" href={{ "/libs/icon.png" | prepend: site.baseurl }}>
  <link rel="shortcut icon" type="image/png" href={{ "/libs/icon.png" | prepend: site.baseurl }}>

</head>
<body>

  <div class="container">

    <section class="header">
      <a class="header-photo" href="{{ site.baseurl }}/"><img src='{{ site.baseurl }}{{ site.data.main_info.profile_pic }}' alt="{{ site.data.main_info.name }}"></a>
      <div class="header-text">
        <h1 class="header-name">{{ site.data.main_info.name }}</h1>
        <p class="header-title">{{ site.data.main_info.title }}</p>
        <p class="header-contact">{{ site.data.main_info.location }}<span class="dot">&middot;</span>{{ site.data.main_info.email }}</p>
        <div class="header-links">
          <a class="pill" href="{{ site.data.main_info.google_scholar }}" target="_blank" rel="noopener">Google Scholar</a>
          <a class="pill" href="{{ site.data.main_info.github }}" target="_blank" rel="noopener">GitHub</a>
          <a class="pill" href="{{ site.data.main_info.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
        </div>
      </div>
    </section>

    <div class="navbar-spacer"></div>
    <nav class="navbar">
      <div class="container">
        <ul class="navbar-list">
          <li class="navbar-item"><a class="navbar-link" href={{ "/index.html#about" | prepend: site.baseurl }}>About</a></li>
          <li class="navbar-item"><a class="navbar-link" href={{ "/index.html#publications" | prepend: site.baseurl }}>Publications</a></li>
          <li class="navbar-item"><a class="navbar-link" href={{ "/index.html#awards" | prepend: site.baseurl }}>Awards</a></li>
          <li class="navbar-item"><a class="navbar-link" href={{ "/index.html#service" | prepend: site.baseurl }}>Service</a></li>
        </ul>
      </div>
    </nav>

    {{ content }}

  </div>

  <!-- Google Analytics -->
  {% include google_analytics.html %}

  <!-- Statcounter (invisible tracking) -->
  {% include statcounter.html %}

  <!-- do not remove
  <span id="62cd7b7da1aff3196fdc26b60e396df9"></span>
   -->

</body>
</html>
